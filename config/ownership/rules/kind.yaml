  # --- Kubeadm / Kubernetes Bootstrap ---

  - name: kubeadm-bootstrap-resource
    priority: 760
    when:
      all:
        - field: resource.namespace
          equals: kube-system
        - field: resource.name
          inCatalog: kubeadmResources
    result:
      authority:
        type: KubernetesBootstrap
        name: kubeadm
      claimLayer: LifecycleAuthority
      evidenceStrength: Corroborating
      authorityState: Detected
      attribution: Direct

  - name: kubeadm-rbac
    priority: 740
    when:
      all:
        - field: resource.name
          matchesCatalog: kubeadmRBAC
