decisions:
  # --- Kind Distribution ---

  - name: kind-distribution-sa
    priority: 750
    when:
      all:
        - field: resource.kind
          equals: ServiceAccount
        - field: resource.namespace
          equals: kube-system
        - field: resource.name
          inCatalog: kindDistributionResources
    result:
      authority:
        type: ClusterDistribution
        name: kind
      claimLayer: LifecycleAuthority
      evidenceStrength: Corroborating
      authorityState: Detected
      attribution: Direct

  - name: kind-distribution-configmap
    priority: 750
